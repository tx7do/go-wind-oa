# OA admin OpenAPI v3 文档生成模板。
#
# inputs 覆蓋 admin/service/v1（鑑權 + 站內信 + 工作的 admin HTTP 端點包裝）。
# 工作流的 HTTP 注解定義在 admin/service/v1/i_workflow.proto，引用
# oa.service.v1 的消息類型——openapi 生成器會自動跟隨 import 解析消息定義。
# out 指向 OA admin-service 的 assets 目錄，openapi.yaml 由 assets.go embed。
#
# 运行：cd backend/app/admin/service && make openapi

version: v2

clean: false

managed:
  enabled: true

  disable:
    - module: buf.build/googleapis/googleapis
    - module: 'buf.build/envoyproxy/protoc-gen-validate'
    - module: buf.build/kratos/apis
    - module: buf.build/gnostic/gnostic
    - module: buf.build/gogo/protobuf
    - module: buf.build/tx7do/pagination
    - module: buf.build/go-wind/redact

  override:
    - file_option: go_package_prefix
      value: go-wind-oa/api/gen/go

inputs:
  - directory: protos
    paths:
      - protos/admin/service/v1

plugins:
  # generate openapi v3 yaml doc
  - local: protoc-gen-openapi
    out: ../app/admin/service/cmd/server/assets
    opt:
      - naming=json
      - depth=2
      - default_response=false
      - enum_type=string
      - output_mode=merged
      - fq_schema_naming=false
