version: v2

# buf.yaml：modules.path=protos，deps 提供google.api / errors /
# pagination / validate / redact 等 remote proto 依賴。
# OA 保留的 proto 域見 api/buf.gen.yaml 的 inputs.paths（oa/internal_message/
# authentication/identity/admin/app 各 service/v1）。
modules:
  - path: protos
    lint:
      use:
        - STANDARD
    breaking:
      use:
        - FILE
deps:
  - 'buf.build/googleapis/googleapis'
  - 'buf.build/kratos/apis'
  - 'buf.build/gnostic/gnostic'
  - 'buf.build/tx7do/pagination'
  - 'buf.build/go-wind/redact'
  - 'buf.build/envoyproxy/protoc-gen-validate'

breaking:
  use:
    - FILE

lint:
  use:
    - DEFAULT
