syntax = "proto3";

package dashboard.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";

// 后台首页 OA 分析概览服务（core 侧 gRPC，admin BFF 转发）
// 为 admin 分析页提供只读 OA 业务聚合统计（工作流工单计数、审批趋势、状态/考勤分布）。
service DashboardService {
  // 获取 OA 概览统计（工单总数 / 待办任务数 / 今日新增工单 / 今日审批操作数）
  rpc GetOverview (google.protobuf.Empty) returns (OaDashboardOverviewResponse);

  // 获取近 N 天每日新增工单趋势
  rpc GetOaTrend (GetOaTrendRequest) returns (OaTrendResponse);

  // 工单按 instance_status 分布
  rpc GetOaInstanceStatusDistribution (google.protobuf.Empty) returns (OaDistributionResponse);

  // 考勤记录按 day_result 分布
  rpc GetOaAttendanceDayResultDistribution (google.protobuf.Empty) returns (OaDistributionResponse);
}

// OA 概览统计卡片
message OaDashboardOverviewResponse {
  optional uint32 workflow_instance_count = 1 [(gnostic.openapi.v3.property) = {title: "工单总数", description: "工作流实例总数（软删/租户隔离由 Policy 处理）"}];
  optional uint32 pending_task_count = 2 [(gnostic.openapi.v3.property) = {title: "待办任务数", description: "处于 PENDING 状态的工作流任务数"}];
  optional uint32 today_new_instance_count = 3 [(gnostic.openapi.v3.property) = {title: "今日新增工单", description: "今日创建的工作流实例数"}];
  optional uint32 today_workflow_action_count = 4 [(gnostic.openapi.v3.property) = {title: "今日审批操作数", description: "今日工作流日志记录的审批动作数"}];
}

// 工单趋势查询参数
message GetOaTrendRequest {
  optional uint32 days = 1 [(gnostic.openapi.v3.property) = {title: "统计天数", description: "近 N 天，默认 7"}];
}

// 工单趋势响应
message OaTrendResponse {
  repeated TrendPoint points = 1 [(gnostic.openapi.v3.property) = {title: "趋势点列表"}];
}

// 单日趋势点
message TrendPoint {
  optional string date = 1 [(gnostic.openapi.v3.property) = {title: "日期", description: "格式 YYYY-MM-DD"}];
  optional uint32 count = 2 [(gnostic.openapi.v3.property) = {title: "当日新增工单数"}];
}

// OA 分布响应
message OaDistributionResponse {
  repeated DistributionItem items = 1 [(gnostic.openapi.v3.property) = {title: "分布项列表"}];
}

// 通用分布项
message DistributionItem {
  optional string label = 1 [(gnostic.openapi.v3.property) = {title: "分组标签", description: "枚举值字符串，由前端做 i18n 映射"}];
  optional uint32 count = 2 [(gnostic.openapi.v3.property) = {title: "计数"}];
}
