syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";

import "internal_message/service/v1/internal_message.proto";

// 站内信参与服务（app 边端，移动端，只读收件箱）
service InternalMessageService {
  // 查询我的收件箱（按当前操作者过滤）
  rpc ListMyMessages(internal_message.service.v1.ListMyMessagesRequest) returns (internal_message.service.v1.ListInternalMessageResponse) {
    option (google.api.http) = {
      get: "/app/v1/internal-message/my-messages"
    };
  }
}
