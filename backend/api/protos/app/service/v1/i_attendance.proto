syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";

import "oa/service/v1/attendance.proto";

// OA 考勤参与服务（app 边端，移动端）
service AttendanceService {
  // 打卡（当日首次=签到，第二次=签退并结算）
  rpc CheckIn(oa.service.v1.CheckInRequest) returns (oa.service.v1.AttendanceRecord) {
    option (google.api.http) = {
      post: "/app/v1/oa/attendance/check-in"
      body: "*"
    };
  }

  // 查询本人打卡记录
  rpc GetMyAttendanceRecords(oa.service.v1.GetMyAttendanceRecordsRequest) returns (oa.service.v1.ListAttendanceRecordsResponse) {
    option (google.api.http) = {
      get: "/app/v1/oa/attendance/my-records"
    };
  }
}
