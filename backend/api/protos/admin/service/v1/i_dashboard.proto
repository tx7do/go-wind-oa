syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "gnostic/openapi/v3/annotations.proto";

import "dashboard/service/v1/i_dashboard.proto";

// 后台首页 OA 分析概览服务（HTTP BFF，转发 core DashboardService）
service DashboardService {
  // 获取 OA 概览统计
  rpc GetOverview (google.protobuf.Empty) returns (dashboard.service.v1.OaDashboardOverviewResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/oa-overview"
    };
  }

  // 获取近 N 天每日新增工单趋势
  rpc GetOaTrend (dashboard.service.v1.GetOaTrendRequest) returns (dashboard.service.v1.OaTrendResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/oa-trend"
    };
  }

  // 工单按 instance_status 分布
  rpc GetOaInstanceStatusDistribution (google.protobuf.Empty) returns (dashboard.service.v1.OaDistributionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/oa-instance-status-distribution"
    };
  }

  // 考勤记录按 day_result 分布
  rpc GetOaAttendanceDayResultDistribution (google.protobuf.Empty) returns (dashboard.service.v1.OaDistributionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/oa-attendance-day-result-distribution"
    };
  }
}
