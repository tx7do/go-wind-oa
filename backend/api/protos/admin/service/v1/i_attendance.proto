syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "oa/service/v1/attendance.proto";

// OA 考勤管理服务（admin 边端）
service AttendanceService {
  // 查询打卡记录（按工作日，可选用户）
  rpc ListAttendanceRecords(oa.service.v1.ListAttendanceRecordsRequest) returns (oa.service.v1.ListAttendanceRecordsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/attendance/records"
    };
  }

  // 读取考勤设置
  rpc GetAttendanceSetting(google.protobuf.Empty) returns (oa.service.v1.AttendanceSetting) {
    option (google.api.http) = {
      get: "/admin/v1/oa/attendance/settings"
    };
  }

  // 更新考勤设置
  rpc UpdateAttendanceSetting(oa.service.v1.AttendanceSetting) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/oa/attendance/settings"
      body: "*"
    };
  }

  // 工作日结算（物化旷工/请假，补结算未签退记录）
  rpc RunDailySettlement(oa.service.v1.RunDailySettlementRequest) returns (oa.service.v1.RunDailySettlementResponse) {
    option (google.api.http) = {
      post: "/admin/v1/oa/attendance/settlements"
      body: "*"
    };
  }

  // 设置节假日/调休日（按日期存在则覆盖）
  rpc UpsertHoliday(oa.service.v1.Holiday) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/oa/attendance/holidays"
      body: "*"
    };
  }

  // 删除节假日/调休日设置
  rpc DeleteHoliday(oa.service.v1.DeleteHolidayRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/oa/attendance/holidays/{id}"
    };
  }

  // 查询年度节假日/调休日设置
  rpc ListHolidays(oa.service.v1.ListHolidaysRequest) returns (oa.service.v1.ListHolidaysResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/attendance/holidays"
    };
  }
}
