syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";

import "oa/service/v1/overtime.proto";

// OA 加班申请管理服务（admin 边端）
service OvertimeService {
  // 查询加班申请列表
  rpc ListOvertimeApplications(oa.service.v1.ListOvertimeApplicationsRequest) returns (oa.service.v1.ListOvertimeApplicationsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/overtime/applications"
    };
  }

  // 查询加班申请详情
  rpc GetOvertimeApplication(oa.service.v1.GetOvertimeApplicationRequest) returns (oa.service.v1.OvertimeApplication) {
    option (google.api.http) = {
      get: "/admin/v1/oa/overtime/applications/{id}"
    };
  }
}
