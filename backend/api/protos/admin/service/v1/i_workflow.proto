syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";

import "oa/service/v1/workflow.proto";

// OA 工作流定义管理服务（admin 边端）
service WorkflowService {
  // 查询流程定义列表
  rpc ListWorkflowDefinition(pagination.PagingRequest) returns (oa.service.v1.ListWorkflowDefinitionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/definitions"
    };
  }

  // 查询流程定义详情
  rpc GetWorkflowDefinition(oa.service.v1.GetWorkflowDefinitionRequest) returns (oa.service.v1.WorkflowDefinition) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/definitions/{id}"
    };
  }

  // 创建流程定义
  rpc CreateWorkflowDefinition(oa.service.v1.CreateWorkflowDefinitionRequest) returns (oa.service.v1.WorkflowDefinition) {
    option (google.api.http) = {
      post: "/admin/v1/oa/workflow/definitions"
      body: "*"
    };
  }

  // 更新流程定义（仅允许切换 definition_status）
  rpc UpdateWorkflowDefinition(oa.service.v1.UpdateWorkflowDefinitionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/oa/workflow/definitions/{id}"
      body: "*"
    };
  }

  // 审批任务（通过/驳回/转办）
  rpc AuditTask(oa.service.v1.AuditTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/oa/workflow/audit-task"
      body: "*"
    };
  }

  // 查询我的任务（待办/已办/我的申请）
  rpc GetMyTasks(oa.service.v1.GetMyTasksRequest) returns (oa.service.v1.GetMyTasksResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/my-tasks"
    };
  }

  // 查询任务详情
  rpc GetTask(oa.service.v1.GetTaskRequest) returns (oa.service.v1.GetTaskResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/tasks/{id}"
    };
  }
}
