syntax = "proto3";

package oa.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// OA 工作流审批引擎服务
service WorkflowService {
  // 创建流程定义
  rpc CreateWorkflowDefinition(CreateWorkflowDefinitionRequest) returns (WorkflowDefinition) {}

  // 查询流程定义列表
  rpc ListWorkflowDefinition(pagination.PagingRequest) returns (ListWorkflowDefinitionResponse) {}

  // 更新流程定义（仅允许切换 definition_status）
  rpc UpdateWorkflowDefinition(UpdateWorkflowDefinitionRequest) returns (google.protobuf.Empty) {}

  // 查询流程定义详情
  rpc GetWorkflowDefinition(GetWorkflowDefinitionRequest) returns (WorkflowDefinition) {}

  // 提交申请
  rpc SubmitApply(SubmitApplyRequest) returns (SubmitApplyResponse) {}

  // 审批任务
  rpc AuditTask(AuditTaskRequest) returns (google.protobuf.Empty) {}

  // 撤回申请（仅申请人本人，仅进行中的实例）
  rpc WithdrawApply(WithdrawApplyRequest) returns (google.protobuf.Empty) {}

  // 获取申请表单定义（按流程 code+version，仅 ENABLED 定义；返回 form_schema JSON）
  rpc GetApplyForm(GetApplyFormRequest) returns (GetApplyFormResponse) {}

  // 查询我的任务（待办/已办/我的申请）
  rpc GetMyTasks(GetMyTasksRequest) returns (GetMyTasksResponse) {}

  // 查询任务详情
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {}
}

// 流程定义
message WorkflowDefinition {
  // 定义状态
  enum DefinitionStatus {
    DRAFT = 0;     // 草稿
    ENABLED = 1;   // 已启用
    DISABLED = 2;  // 已禁用
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "定义ID" }
  ]; // 定义ID

  optional string code = 2 [
    json_name = "code",
    (gnostic.openapi.v3.property) = { description: "流程代码" }
  ]; // 流程代码

  optional int32 version = 3 [
    json_name = "version",
    (gnostic.openapi.v3.property) = { description: "版本号" }
  ]; // 版本号

  optional string node_config = 4 [
    json_name = "nodeConfig",
    (gnostic.openapi.v3.property) = { description: "节点配置（JSON）。每节点格式：{\"approvers\":[{\"type\":\"USER\"|\"LEADER\"|\"POSITION\",\"id\":用户或职位ID}],\"strategy\":\"ALL\"|\"ANY\"}。type=LEADER 无需 id（提交人主管）。strategy=ALL 会签（默认），ANY 或签。兼容旧格式 {\"approver_type\":\"USER\",\"approver\":id}" }
  ]; // 节点配置（JSON）

  optional string form_schema = 5 [
    json_name = "formSchema",
    (gnostic.openapi.v3.property) = { description: "表单 schema（JSON）" }
  ]; // 表单 schema（JSON）

  optional DefinitionStatus definition_status = 6 [
    json_name = "definitionStatus",
    (gnostic.openapi.v3.property) = { description: "定义状态" }
  ]; // 定义状态

  optional string remark = 7 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = { description: "备注" }
  ]; // 备注

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局角色"}
  ];  // 租户ID，0代表系统全局角色

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 流程实例
message WorkflowInstance {
  // 实例状态
  enum InstanceStatus {
    PENDING = 0;     // 进行中
    APPROVED = 1;    // 已通过
    REJECTED = 2;    // 已驳回
    WITHDRAWN = 3;   // 已撤回
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "实例ID" }
  ]; // 实例ID

  optional InstanceStatus instance_status = 2 [
    json_name = "instanceStatus",
    (gnostic.openapi.v3.property) = { description: "实例状态" }
  ]; // 实例状态

  optional int32 current_node_index = 3 [
    json_name = "currentNodeIndex",
    (gnostic.openapi.v3.property) = { description: "当前节点索引" }
  ]; // 当前节点索引

  optional string form_data = 4 [
    json_name = "formData",
    (gnostic.openapi.v3.property) = { description: "申请表单数据（JSON）" }
  ]; // 申请表单数据（JSON）

  optional string business_type = 5 [
    json_name = "businessType",
    (gnostic.openapi.v3.property) = { description: "业务单据类型（如 LEAVE/EXPENSE，审批终结时回调对应业务模块）" }
  ]; // 业务单据类型

  optional uint32 business_id = 6 [
    json_name = "businessId",
    (gnostic.openapi.v3.property) = { description: "业务单据ID" }
  ]; // 业务单据ID

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局角色"}
  ];  // 租户ID，0代表系统全局角色

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 审批任务
message WorkflowTask {
  // 任务状态
  enum TaskStatus {
    PENDING = 0;     // 待处理
    APPROVED = 1;    // 已通过
    REJECTED = 2;    // 已驳回
    CANCELLED = 3;   // 已取消（会签/或签推进或实例终结时被取消）
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "任务ID" }
  ]; // 任务ID

  optional int32 node_index = 2 [
    json_name = "nodeIndex",
    (gnostic.openapi.v3.property) = { description: "节点索引" }
  ]; // 节点索引

  optional uint32 assignee_user_id = 3 [
    json_name = "assigneeUserId",
    (gnostic.openapi.v3.property) = { description: "指派审批人ID" }
  ]; // 指派审批人ID

  optional TaskStatus task_status = 4 [
    json_name = "taskStatus",
    (gnostic.openapi.v3.property) = { description: "任务状态" }
  ]; // 任务状态

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局角色"}
  ];  // 租户ID，0代表系统全局角色

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 审批日志
message WorkflowLog {
  // 日志动作
  enum LogAction {
    SUBMIT = 0;    // 提交申请
    APPROVE = 1;   // 通过
    REJECT = 2;    // 驳回
    FORWARD = 3;   // 转办
    WITHDRAW = 4;  // 撤回
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "日志ID" }
  ]; // 日志ID

  optional int32 node_index = 2 [
    json_name = "nodeIndex",
    (gnostic.openapi.v3.property) = { description: "节点索引" }
  ]; // 节点索引

  optional LogAction log_action = 3 [
    json_name = "logAction",
    (gnostic.openapi.v3.property) = { description: "日志动作" }
  ]; // 日志动作

  optional string comment = 4 [
    json_name = "comment",
    (gnostic.openapi.v3.property) = { description: "审批意见" }
  ]; // 审批意见

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局角色"}
  ];  // 租户ID，0代表系统全局角色

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 我的任务列表项
message MyTaskItem {
  optional uint32 task_id = 4 [
    json_name = "taskId",
    (gnostic.openapi.v3.property) = { description: "任务ID（待办列表填充，供进入详情）" }
  ]; // 任务ID

  optional uint32 instance_id = 1 [
    json_name = "instanceId",
    (gnostic.openapi.v3.property) = { description: "实例ID" }
  ]; // 实例ID

  optional google.protobuf.Timestamp created_at = 2 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间

  optional string status_label = 3 [
    json_name = "statusLabel",
    (gnostic.openapi.v3.property) = { description: "状态标签" }
  ]; // 状态标签
}

// 查询流程定义列表 - 回应
message ListWorkflowDefinitionResponse {
  repeated WorkflowDefinition items = 1;
  uint64 total = 2;
}

// 查询流程定义详情 - 请求
message GetWorkflowDefinitionRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建流程定义 - 请求
message CreateWorkflowDefinitionRequest {
  WorkflowDefinition data = 1;
}

// 更新流程定义 - 请求
message UpdateWorkflowDefinitionRequest {
  uint32 id = 1;

  WorkflowDefinition data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
}

// 提交申请 - 请求
message SubmitApplyRequest {
  string code = 1 [
    json_name = "code",
    (gnostic.openapi.v3.property) = { description: "流程代码" }
  ]; // 流程代码

  int32 version = 2 [
    json_name = "version",
    (gnostic.openapi.v3.property) = { description: "版本号" }
  ]; // 版本号

  string form_data = 3 [
    json_name = "formData",
    (gnostic.openapi.v3.property) = { description: "申请表单数据（JSON）" }
  ]; // 申请表单数据（JSON）

  optional string business_type = 4 [
    json_name = "businessType",
    (gnostic.openapi.v3.property) = { description: "业务单据类型（如 LEAVE/EXPENSE），由业务模块在服务端提交时填充" }
  ]; // 业务单据类型

  optional uint32 business_id = 5 [
    json_name = "businessId",
    (gnostic.openapi.v3.property) = { description: "业务单据ID" }
  ]; // 业务单据ID
}

// 提交申请 - 回应
message SubmitApplyResponse {
  uint32 instance_id = 1 [
    json_name = "instanceId",
    (gnostic.openapi.v3.property) = { description: "实例ID" }
  ]; // 实例ID
}

// 获取申请表单定义 - 请求
message GetApplyFormRequest {
  string code = 1 [
    json_name = "code",
    (gnostic.openapi.v3.property) = { description: "流程代码" }
  ]; // 流程代码

  int32 version = 2 [
    json_name = "version",
    (gnostic.openapi.v3.property) = { description: "版本号" }
  ]; // 版本号
}

// 获取申请表单定义 - 回应
message GetApplyFormResponse {
  string form_schema = 1 [
    json_name = "formSchema",
    (gnostic.openapi.v3.property) = { description: "表单字段描述数组（JSON）：[{key,label,type:text|textarea|number|date|select,required,options}]。空串表示无表单定义，客户端回退自由 JSON 输入" }
  ]; // 表单字段描述
}

// 撤回申请 - 请求
message WithdrawApplyRequest {
  uint32 instance_id = 1 [
    json_name = "instanceId",
    (gnostic.openapi.v3.property) = { description: "实例ID" }
  ]; // 实例ID
}

// 审批动作
enum AuditAction {
  APPROVE = 0;  // 通过
  REJECT = 1;   // 驳回
  FORWARD = 2;  // 转办
}

// 审批任务 - 请求
message AuditTaskRequest {
  uint32 task_id = 1 [
    json_name = "taskId",
    (gnostic.openapi.v3.property) = { description: "任务ID" }
  ]; // 任务ID

  AuditAction action = 2 [
    json_name = "action",
    (gnostic.openapi.v3.property) = { description: "审批动作" }
  ]; // 审批动作

  uint32 forward_to = 3 [
    json_name = "forwardTo",
    (gnostic.openapi.v3.property) = { description: "转办目标用户ID" }
  ]; // 转办目标用户ID

  string comment = 4 [
    json_name = "comment",
    (gnostic.openapi.v3.property) = { description: "审批意见" }
  ]; // 审批意见
}

// 任务列表类型
enum ListType {
  PENDING = 0;    // 待办
  DONE = 1;       // 已办
  SUBMITTED = 2;  // 我的申请
}

// 查询我的任务 - 请求
message GetMyTasksRequest {
  ListType list_type = 1 [
    json_name = "listType",
    (gnostic.openapi.v3.property) = { description: "列表类型" }
  ]; // 列表类型

  optional int32 page = 2 [
    json_name = "page",
    (gnostic.openapi.v3.property) = { description: "页码（从 1 起，不传=不限页）" }
  ]; // 页码

  optional int32 page_size = 3 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = { description: "每页条数（不传=不限页）" }
  ]; // 每页条数
}

// 查询我的任务 - 回应
message GetMyTasksResponse {
  repeated MyTaskItem items = 1;
  uint64 total = 2;
}

// 查询任务详情 - 请求
message GetTaskRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 查询任务详情 - 回应
message GetTaskResponse {
  optional WorkflowTask task = 1 [
    json_name = "task",
    (gnostic.openapi.v3.property) = { description: "任务详情" }
  ]; // 任务详情

  repeated WorkflowLog logs = 2 [
    json_name = "logs",
    (gnostic.openapi.v3.property) = { description: "审批历史" }
  ]; // 审批历史

  optional string form_data = 3 [
    json_name = "formData",
    (gnostic.openapi.v3.property) = { description: "申请表单数据（JSON，供审批人查看申请内容）" }
  ]; // 申请表单数据
}
