syntax = "proto3";

package oa.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// OA 费用报销服务（申请单 + 多明细 + 发票凭证文件引用，挂 EXPENSE 工作流审批）
service ExpenseService {
  // 提交报销申请（自动创建 EXPENSE 工作流实例）
  rpc SubmitExpenseApplication(SubmitExpenseApplicationRequest) returns (SubmitExpenseApplicationResponse) {}

  // 查询报销申请（user_id==0 时查全部，admin 用）
  rpc ListExpenseApplications(ListExpenseApplicationsRequest) returns (ListExpenseApplicationsResponse) {}

  // 查询报销申请详情（申请人本人或 admin）
  rpc GetExpenseApplication(GetExpenseApplicationRequest) returns (ExpenseApplication) {}
}

// 报销明细行
message ExpenseItem {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "明细ID" }
  ]; // 明细ID

  optional string category = 2 [
    json_name = "category",
    (gnostic.openapi.v3.property) = { description: "费用类别（交通/餐饮/办公等）" }
  ]; // 费用类别

  optional double amount = 3 [
    json_name = "amount",
    (gnostic.openapi.v3.property) = { description: "金额" }
  ]; // 金额

  optional google.protobuf.Timestamp expense_date = 4 [
    json_name = "expenseDate",
    (gnostic.openapi.v3.property) = { description: "费用发生日期" }
  ]; // 费用发生日期

  optional string description = 5 [
    json_name = "description",
    (gnostic.openapi.v3.property) = { description: "费用说明" }
  ]; // 费用说明

  optional uint32 invoice_file_id = 6 [
    json_name = "invoiceFileId",
    (gnostic.openapi.v3.property) = { description: "发票凭证文件ID（storage 域文件，OSS 存储）" }
  ]; // 发票凭证文件ID

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];  // 租户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
}

// 报销申请单
message ExpenseApplication {
  // 申请单状态（与工作流实例终态同步）
  enum ExpenseStatus {
    PENDING = 0;    // 审批中
    APPROVED = 1;   // 已通过
    REJECTED = 2;   // 已驳回
    WITHDRAWN = 3;  // 已撤回
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "申请单ID" }
  ]; // 申请单ID

  optional string title = 2 [
    json_name = "title",
    (gnostic.openapi.v3.property) = { description: "报销事由标题" }
  ]; // 报销事由标题

  optional double total_amount = 3 [
    json_name = "totalAmount",
    (gnostic.openapi.v3.property) = { description: "报销总额（各明细金额之和）" }
  ]; // 报销总额

  optional ExpenseStatus expense_status = 4 [
    json_name = "expenseStatus",
    (gnostic.openapi.v3.property) = { description: "申请单状态" }
  ]; // 申请单状态

  optional uint32 instance_id = 5 [
    json_name = "instanceId",
    (gnostic.openapi.v3.property) = { description: "关联工作流实例ID" }
  ]; // 关联工作流实例ID

  repeated ExpenseItem items = 6 [
    json_name = "items",
    (gnostic.openapi.v3.property) = { description: "费用明细列表" }
  ]; // 费用明细列表

  optional string applicant_name = 7 [
    json_name = "applicantName",
    (gnostic.openapi.v3.property) = { description: "申请人姓名（服务端回填）" }
  ]; // 申请人姓名

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];  // 租户ID

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "申请人用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

// 提交报销申请 - 请求
message SubmitExpenseApplicationRequest {
  string title = 1 [
    json_name = "title",
    (gnostic.openapi.v3.property) = { description: "报销事由标题" }
  ]; // 报销事由标题

  repeated ExpenseItem items = 2 [
    json_name = "items",
    (gnostic.openapi.v3.property) = { description: "费用明细（id/tenant_id/created_at 由服务端忽略）" }
  ]; // 费用明细
}

// 提交报销申请 - 回应
message SubmitExpenseApplicationResponse {
  uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "申请单ID" }
  ]; // 申请单ID

  uint32 instance_id = 2 [
    json_name = "instanceId",
    (gnostic.openapi.v3.property) = { description: "工作流实例ID" }
  ]; // 工作流实例ID
}

// 查询报销申请 - 请求
message ListExpenseApplicationsRequest {
  uint32 user_id = 1 [
    json_name = "userId",
    (gnostic.openapi.v3.property) = { description: "申请人用户ID，0=全部（app 端忽略此字段按本人查）" }
  ]; // 申请人用户ID

  ExpenseApplication.ExpenseStatus status = 2 [
    json_name = "status",
    (gnostic.openapi.v3.property) = { description: "状态过滤，不传=全部" }
  ]; // 状态过滤

  optional int32 page = 3 [
    json_name = "page",
    (gnostic.openapi.v3.property) = { description: "页码（从 1 起，不传=不限页）" }
  ]; // 页码

  optional int32 page_size = 4 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = { description: "每页条数（不传=不限页）" }
  ]; // 每页条数
}

// 查询报销申请 - 回应
message ListExpenseApplicationsResponse {
  repeated ExpenseApplication items = 1;
  uint64 total = 2;
}

// 查询报销申请详情 - 请求
message GetExpenseApplicationRequest {
  uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "申请单ID" }
  ]; // 申请单ID
}
