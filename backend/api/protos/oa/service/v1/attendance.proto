syntax = "proto3";

package oa.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// OA 考勤服务（打卡记录含 GPS/WifiBSSID，工作日结算自动计算迟到/早退/旷工，
// 已通过的请假单覆盖工作日时记为请假）
service AttendanceService {
  // 打卡（app 端）。当日首次打卡=上班签到，第二次=下班签退并结算当日结果。
  rpc CheckIn(CheckInRequest) returns (AttendanceRecord) {}

  // 查询本人打卡记录（app 端，按日期范围）
  rpc GetMyAttendanceRecords(GetMyAttendanceRecordsRequest) returns (ListAttendanceRecordsResponse) {}

  // 查询打卡记录（admin，按日期，可选用户过滤）
  rpc ListAttendanceRecords(ListAttendanceRecordsRequest) returns (ListAttendanceRecordsResponse) {}

  // 读取本租户考勤设置（admin）
  rpc GetAttendanceSetting(google.protobuf.Empty) returns (AttendanceSetting) {}

  // 更新本租户考勤设置（admin）
  rpc UpdateAttendanceSetting(AttendanceSetting) returns (google.protobuf.Empty) {}

  // 工作日结算（admin）：对指定日期为全部用户物化记录——无打卡且无请假覆盖记旷工，
  // 请假覆盖记请假；有签退未结算的记录补结算。可由外部定时任务每日调用。
  // 休息日（周末或节假日表 HOLIDAY）跳过；调休 WORKDAY 覆盖周末照常结算。
  rpc RunDailySettlement(RunDailySettlementRequest) returns (RunDailySettlementResponse) {}

  // 设置节假日/调休日（admin，按日期存在则覆盖）
  rpc UpsertHoliday(Holiday) returns (google.protobuf.Empty) {}

  // 删除节假日/调休日设置（admin）
  rpc DeleteHoliday(DeleteHolidayRequest) returns (google.protobuf.Empty) {}

  // 查询某年度的节假日/调休日设置（admin）
  rpc ListHolidays(ListHolidaysRequest) returns (ListHolidaysResponse) {}
}

// 节假日/调休日设置
message Holiday {
  // 类型
  enum HolidayType {
    HOLIDAY = 0;  // 法定假日（休息，优先于周末判定）
    WORKDAY = 1;  // 调休上班（该日照常结算，即使落在周末）
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "ID" }
  ]; // ID

  optional google.protobuf.Timestamp date = 2 [
    json_name = "date",
    (gnostic.openapi.v3.property) = { description: "日期（零点，租户内唯一）" }
  ]; // 日期

  optional HolidayType holiday_type = 3 [
    json_name = "holidayType",
    (gnostic.openapi.v3.property) = { description: "类型" }
  ]; // 类型

  optional string name = 4 [
    json_name = "name",
    (gnostic.openapi.v3.property) = { description: "名称（如 国庆节/调休上班）" }
  ]; // 名称

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];  // 租户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
}

// 删除节假日设置 - 请求
message DeleteHolidayRequest {
  uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "ID" }
  ]; // ID
}

// 查询节假日 - 请求
message ListHolidaysRequest {
  int32 year = 1 [
    json_name = "year",
    (gnostic.openapi.v3.property) = { description: "年度，0=当年" }
  ]; // 年度
}

// 查询节假日 - 回应
message ListHolidaysResponse {
  repeated Holiday items = 1;
  uint64 total = 2;
}

// 打卡记录（用户 x 工作日 唯一）
message AttendanceRecord {
  // 当日结算结果
  enum DayResult {
    PENDING = 0;      // 未结算（未签退或未触发结算）
    NORMAL = 1;       // 正常
    LATE = 2;         // 迟到
    EARLY_LEAVE = 3;  // 早退
    ABSENT = 4;       // 旷工
    ON_LEAVE = 5;     // 请假（已通过的请假单覆盖当日）
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "记录ID" }
  ]; // 记录ID

  optional uint32 user_id = 2 [
    json_name = "userId",
    (gnostic.openapi.v3.property) = { description: "用户ID" }
  ]; // 用户ID

  optional string user_name = 13 [
    json_name = "userName",
    (gnostic.openapi.v3.property) = { description: "用户姓名（服务端回填）" }
  ]; // 用户姓名

  optional google.protobuf.Timestamp work_date = 3 [
    json_name = "workDate",
    (gnostic.openapi.v3.property) = { description: "工作日（日期，零点）" }
  ]; // 工作日

  optional google.protobuf.Timestamp check_in_at = 4 [
    json_name = "checkInAt",
    (gnostic.openapi.v3.property) = { description: "上班签到时间" }
  ]; // 上班签到时间

  optional double check_in_latitude = 5 [
    json_name = "checkInLatitude",
    (gnostic.openapi.v3.property) = { description: "签到 GPS 纬度" }
  ]; // 签到 GPS 纬度

  optional double check_in_longitude = 6 [
    json_name = "checkInLongitude",
    (gnostic.openapi.v3.property) = { description: "签到 GPS 经度" }
  ]; // 签到 GPS 经度

  optional string check_in_wifi_bssid = 7 [
    json_name = "checkInWifiBssid",
    (gnostic.openapi.v3.property) = { description: "签到 Wifi BSSID" }
  ]; // 签到 Wifi BSSID

  optional google.protobuf.Timestamp check_out_at = 8 [
    json_name = "checkOutAt",
    (gnostic.openapi.v3.property) = { description: "下班签退时间" }
  ]; // 下班签退时间

  optional double check_out_latitude = 9 [
    json_name = "checkOutLatitude",
    (gnostic.openapi.v3.property) = { description: "签退 GPS 纬度" }
  ]; // 签退 GPS 纬度

  optional double check_out_longitude = 10 [
    json_name = "checkOutLongitude",
    (gnostic.openapi.v3.property) = { description: "签退 GPS 经度" }
  ]; // 签退 GPS 经度

  optional string check_out_wifi_bssid = 11 [
    json_name = "checkOutWifiBssid",
    (gnostic.openapi.v3.property) = { description: "签退 Wifi BSSID" }
  ]; // 签退 Wifi BSSID

  optional DayResult day_result = 12 [
    json_name = "dayResult",
    (gnostic.openapi.v3.property) = { description: "当日结算结果" }
  ]; // 当日结算结果

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];  // 租户ID

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
}

// 考勤设置（每租户一行）
message AttendanceSetting {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = { description: "设置ID" }
  ]; // 设置ID

  optional string work_start_time = 2 [
    json_name = "workStartTime",
    (gnostic.openapi.v3.property) = { description: "上班时间（HH:MM，默认 09:00），晚于记迟到" }
  ]; // 上班时间

  optional string work_end_time = 3 [
    json_name = "workEndTime",
    (gnostic.openapi.v3.property) = { description: "下班时间（HH:MM，默认 18:00），早于记早退" }
  ]; // 下班时间

  optional uint32 tenant_id = 40 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];  // 租户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
}

// 打卡 - 请求
message CheckInRequest {
  double latitude = 1 [
    json_name = "latitude",
    (gnostic.openapi.v3.property) = { description: "GPS 纬度（不可用时传 0）" }
  ]; // GPS 纬度

  double longitude = 2 [
    json_name = "longitude",
    (gnostic.openapi.v3.property) = { description: "GPS 经度（不可用时传 0）" }
  ]; // GPS 经度

  string wifi_bssid = 3 [
    json_name = "wifiBssid",
    (gnostic.openapi.v3.property) = { description: "Wifi BSSID（尽力采集，可为空）" }
  ]; // Wifi BSSID
}

// 查询本人记录 - 请求
message GetMyAttendanceRecordsRequest {
  google.protobuf.Timestamp start_date = 1 [
    json_name = "startDate",
    (gnostic.openapi.v3.property) = { description: "开始日期（含），不传=近 30 天" }
  ]; // 开始日期

  google.protobuf.Timestamp end_date = 2 [
    json_name = "endDate",
    (gnostic.openapi.v3.property) = { description: "结束日期（含）" }
  ]; // 结束日期
}

// 查询记录 - 请求（admin）
message ListAttendanceRecordsRequest {
  google.protobuf.Timestamp work_date = 1 [
    json_name = "workDate",
    (gnostic.openapi.v3.property) = { description: "工作日（日期，零点）" }
  ]; // 工作日

  uint32 user_id = 2 [
    json_name = "userId",
    (gnostic.openapi.v3.property) = { description: "用户ID，0=全部" }
  ]; // 用户ID
}

// 查询记录 - 回应
message ListAttendanceRecordsResponse {
  repeated AttendanceRecord items = 1;
  uint64 total = 2;
}

// 工作日结算 - 请求（admin）
message RunDailySettlementRequest {
  google.protobuf.Timestamp work_date = 1 [
    json_name = "workDate",
    (gnostic.openapi.v3.property) = { description: "结算日期（日期，零点），不传=今天" }
  ]; // 结算日期
}

// 工作日结算 - 回应
message RunDailySettlementResponse {
  uint32 settled_count = 1 [
    json_name = "settledCount",
    (gnostic.openapi.v3.property) = { description: "结算/物化的记录数" }
  ]; // 结算记录数
}
