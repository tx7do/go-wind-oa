syntax = "proto3";

package oa.v1;

import "errors/errors.proto";

// OaErrorReason OA 服务错误枚举。由 protoc-gen-go-errors 生成
// oav1.ErrorBadRequest / ErrorForbidden / ... 等具名构造器，供服务层
// 返回带 HTTP 状态码的 kratos 错误（与 go-wind-cms 各 *_error.proto 同构）。
enum OaErrorReason {
  option (errors.default_code) = 500;

  INTERNAL_ERROR = 0 [(errors.code) = 500];
  BAD_REQUEST = 1 [(errors.code) = 400];
  UNAUTHORIZED = 2 [(errors.code) = 401];
  FORBIDDEN = 3 [(errors.code) = 403];
  NOT_FOUND = 4 [(errors.code) = 404];
  CONFLICT = 5 [(errors.code) = 409];
}
