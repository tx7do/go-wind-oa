syntax = "proto3";

package oa.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

// OA 工作流审批服务。
//
// 该服务为单层服务：HTTP 注解与本消息定义同在一个 proto 中，由 buf 一次性
// 生成 gRPC 与 HTTP 双协议桩。所有 RPC 均需鉴权，租户/操作人上下文由
// auth 中间件注入、由 OA viewer 中间件翻译为 ent viewer context，
// 供 TenantPrivacy 策略做行级租户隔离。
service WorkflowService {
  // 创建工作流定义（管理端）。
  rpc CreateWorkflowDefinition(CreateWorkflowDefinitionRequest) returns (WorkflowDefinition) {
    option (google.api.http) = {
      post: "/admin/v1/oa/workflow/definitions"
      body: "*"
    };
  }

  // 查询工作流定义列表（管理端）。
  rpc ListWorkflowDefinition(ListWorkflowDefinitionRequest) returns (ListWorkflowDefinitionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/definitions"
    };
  }

  // 提交申请：发起一个工作流实例，按定义的首节点生成首条待办任务并通知该审批人。
  rpc SubmitApply(SubmitApplyRequest) returns (SubmitApplyResponse) {
    option (google.api.http) = {
      post: "/admin/v1/oa/workflow/apply"
      body: "*"
    };
  }

  // 审批/驳回/转办当前待办任务。状态机在此推进实例状态、生成下一节点任务或终结实例。
  rpc AuditTask(AuditTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/oa/workflow/tasks/{task_id}/audit"
      body: "*"
    };
  }

  // 获取当前用户的待办 / 已办 / 我的申请列表。
  rpc GetMyTasks(GetMyTasksRequest) returns (GetMyTasksResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/my-tasks"
    };
  }

  // 获取单个待办任务详情：申请标题、申请表单数据、该实例的审批日志轨迹。
  //
  // 鉴权：仅当前指派审批人可查其处于 PENDING 的任务（与 AuditTask 同款授权，
  // IDEQ + AssigneeUserIDEQ(caller) + TaskStatusEQ(PENDING)，见
  // WorkflowTaskRepo.GetDetailByAssignee）。其余字段（definition_id /
  // current_node_index / tenant_id 等）不投影，对齐 MyTaskItem 的最小披露原则。
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option (google.api.http) = {
      get: "/admin/v1/oa/workflow/tasks/{task_id}"
    };
  }
}

// ---- 工作流定义 ----

message WorkflowDefinition {
  enum DefinitionStatus {
    DRAFT = 0;
    ENABLED = 1;
    DISABLED = 2;
  }

  optional uint32 id = 1;
  optional string name = 2;
  optional string code = 3;
  optional uint32 version = 4;
  optional string description = 5;
  // 节点配置，原始 JSON 文本。结构由引擎 internal/workflow 包解析。
  optional string node_config = 6;
  // 动态表单 schema，原始 JSON 文本，供前端按定义渲染。
  optional string form_schema = 7;
  optional DefinitionStatus definition_status = 8;

  // ---- 租户 / 审计字段（与 go-wind-cms 固定字段号对齐） ----
  optional uint32 tenant_id = 40;
  optional string tenant_name = 41;
  optional uint32 created_by = 100;
  optional uint32 updated_by = 101;
  optional uint32 deleted_by = 102;
  optional google.protobuf.Timestamp created_at = 200;
  optional google.protobuf.Timestamp updated_at = 201;
  optional google.protobuf.Timestamp deleted_at = 202;
}

message CreateWorkflowDefinitionRequest {
  WorkflowDefinition data = 1;
}

message ListWorkflowDefinitionRequest {
  pagination.PagingRequest paging = 1;
}

message ListWorkflowDefinitionResponse {
  repeated WorkflowDefinition items = 1;
  uint64 total = 2;
}

// ---- 工作流实例 ----

message WorkflowInstance {
  enum InstanceStatus {
    PENDING = 0;
    APPROVED = 1;
    REJECTED = 2;
    CANCELED = 3;
  }

  optional uint32 id = 1;
  optional uint32 definition_id = 2;
  optional string title = 3;
  // 申请表单数据，原始 JSON 文本。引擎不解释其字段语义。
  optional string form_data = 4;
  optional InstanceStatus instance_status = 5;
  optional int32 current_node_index = 6;

  // ---- 租户 / 审计字段 ----
  optional uint32 tenant_id = 40;
  optional string tenant_name = 41;
  optional uint32 created_by = 100;
  optional uint32 updated_by = 101;
  optional uint32 deleted_by = 102;
  optional google.protobuf.Timestamp created_at = 200;
  optional google.protobuf.Timestamp updated_at = 201;
  optional google.protobuf.Timestamp deleted_at = 202;
}

message SubmitApplyRequest {
  string definition_code = 1;
  uint32 definition_version = 2;
  string title = 3;
  // 申请表单数据，原始 JSON 文本。
  string form_data = 4;
}

message SubmitApplyResponse {
  uint32 instance_id = 1;
}

// ---- 工作流任务 ----

message WorkflowTask {
  enum TaskStatus {
    PENDING = 0;
    APPROVED = 1;
    REJECTED = 2;
    FORWARDED = 3;
  }

  optional uint32 id = 1;
  optional uint32 instance_id = 2;
  optional int32 node_index = 3;
  optional uint32 assignee_user_id = 4;
  optional TaskStatus task_status = 5;

  // ---- 租户 / 审计字段 ----
  optional uint32 tenant_id = 40;
  optional string tenant_name = 41;
  optional uint32 created_by = 100;
  optional uint32 updated_by = 101;
  optional uint32 deleted_by = 102;
  optional google.protobuf.Timestamp created_at = 200;
  optional google.protobuf.Timestamp updated_at = 201;
  optional google.protobuf.Timestamp deleted_at = 202;
}

message AuditTaskRequest {
  enum AuditAction {
    APPROVE = 0;
    REJECT = 1;
    FORWARD = 2;
  }

  // 绑定路径参数 {task_id}。
  uint32 task_id = 1;
  AuditAction action = 2;
  optional string comment = 3;
  // 仅 action == FORWARD 时有效：被转办人 ID。
  optional uint32 forward_to_user_id = 4;
}

// ---- 工作流审计日志 ----

message WorkflowLog {
  enum LogAction {
    SUBMIT = 0;
    APPROVE = 1;
    REJECT = 2;
    FORWARD = 3;
    CANCEL = 4;
  }

  optional uint32 id = 1;
  optional uint32 instance_id = 2;
  optional int32 node_index = 3;
  optional LogAction log_action = 4;
  optional string comment = 5;

  // ---- 租户 / 审计字段 ----
  optional uint32 tenant_id = 40;
  optional string tenant_name = 41;
  optional uint32 created_by = 100;
  optional uint32 updated_by = 101;
  optional uint32 deleted_by = 102;
  optional google.protobuf.Timestamp created_at = 200;
  optional google.protobuf.Timestamp updated_at = 201;
  optional google.protobuf.Timestamp deleted_at = 202;
}

// ---- 我的任务视图 ----

message GetMyTasksRequest {
  enum ListType {
    PENDING = 0;
    DONE = 1;
    SUBMITTED = 2;
  }

  ListType list_type = 1;
  pagination.PagingRequest paging = 2;
}

message MyTaskItem {
  // 各字段按 list_type 选择性填充。
  optional uint32 task_id = 1;
  optional uint32 log_id = 2;
  optional uint32 instance_id = 3;
  optional string title = 4;
  optional string status_label = 5;
  optional string action_label = 6;
  optional string comment = 7;
  optional google.protobuf.Timestamp occurred_at = 8;
}

message GetMyTasksResponse {
  repeated MyTaskItem items = 1;
  uint64 total = 2;
}

// ---- 单任务详情 ----

message GetTaskRequest {
  uint32 task_id = 1;
}

// GetTaskResponse 投影待办任务详情。字段对齐详情页渲染所需，最小披露：
// 申请标题、申请表单数据（原始 JSON 文本，引擎不解释）、该实例的审批日志轨迹。
message GetTaskResponse {
  optional uint32 task_id = 1;
  optional uint32 instance_id = 2;
  optional string title = 3;            // 申请标题（来自实例）
  optional string form_data = 4;        // 申请表单数据，原始 JSON 文本
  repeated AuditLogEntry history = 5;   // 该实例的审批日志轨迹
}

// AuditLogEntry 审批日志轨迹条目。投影自 WorkflowLog，仅含审批类动作
// （APPROVE / REJECT / FORWARD），与 ListByActor 的过滤口径一致。
message AuditLogEntry {
  optional string action_label = 1;     // 日志动作的文本标签
  optional string comment = 2;          // 审批人附注
  optional google.protobuf.Timestamp occurred_at = 3;
}
