syntax = "proto3";

package oa.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// OA 鉴权服务。
//
// 该服务为单层服务：HTTP 注解与本消息定义同在一个 proto 中，由 buf 一次性
// 生成 gRPC 与 HTTP 双协议桩。
//
// OA 后端不自建账号体系，登录/登出/验证码/令牌刷新均经此服务转发至
// go-wind-cms 的 admin-service AuthenticationService（cms
// authentication.proto / i_authentication.proto 的 admin 端 HTTP 包装）。
// 消息定义（LoginRequest/LoginResponse/GrantType/TokenType/ClientType/
// GenerateCaptchaResponse/VerifyCaptchaRequest/VerifyCaptchaResponse）与
// cms authentication.service.v1 同构——字段编号、json_name、gnostic
// OpenAPI 描述均逐字段对齐，使 oa↔cms 的结构体翻译为零损耗。
//
// 与 cms 的差异：
//   - package 为 oa.v1（由 OA buf managed 映射至 go-wind-oa/api/gen/go/oa/v1）；
//   - 剥离 (redact.value) 注解——该注解仅用于 cms 服务端日志脱敏，OA 转发层
//     不落日志、不依赖 redact proto；
//   - 不含 RegisterUser / WhoAmI / BlockToken 等 cms 管理端专有 RPC（OA
//     仅需登录闭环）。
service AuthenticationService {
  // 登录。转发至 cms /admin/v1/login。
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/admin/v1/login"
      body: "*"
    };

    option (gnostic.openapi.v3.operation) = {
      security: {}
    };
  }

  // 登出。转发至 cms /admin/v1/logout。
  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/logout"
      body: "*"
    };
  }

  // 刷新认证令牌。转发至 cms /admin/v1/refresh-token。
  rpc RefreshToken(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/admin/v1/refresh-token"
      body: "*"
    };
  }

  // 生成验证码。转发至 cms /admin/v1/captcha。
  rpc GenerateCaptcha(google.protobuf.Empty) returns (GenerateCaptchaResponse) {
    option (google.api.http) = {
      get: "/admin/v1/captcha"
    };

    option (gnostic.openapi.v3.operation) = {
      security: {}
    };
  }

  // 验证验证码。转发至 cms /admin/v1/captcha/verify。
  rpc VerifyCaptcha(VerifyCaptchaRequest) returns (VerifyCaptchaResponse) {
    option (google.api.http) = {
      post: "/admin/v1/captcha/verify"
      body: "*"
    };

    option (gnostic.openapi.v3.operation) = {
      security: {}
    };
  }
}

// 授权类型。与 cms authentication.service.v1.GrantType 同构。
enum GrantType {
  password = 0;          // 密码模式（Resource Owner Password Credentials Grant）
  client_credentials = 1; // 客户端模式（Client Credentials Grant）
  authorization_code = 2; // 授权码模式（Authorization Code Grant）
  refresh_token = 3;     // 刷新令牌 (Refresh Token)
  implicit = 4;          // 简化模式 (Implicit Grant)
}

// 令牌类型。与 cms authentication.service.v1.TokenType 同构。
enum TokenType {
  bearer = 0; // Bearer
  mac = 1;    // MAC
}

// 客户端类型。与 cms authentication.service.v1.ClientType 同构。
enum ClientType {
  admin = 0; // 管理端
  app = 1;   // APP
}

// 用户登录 - 请求。与 cms LoginRequest 同构（字段编号、json_name、OpenAPI
// 描述逐字段对齐），仅剥离 (redact.value) 注解。
message LoginRequest {
  GrantType grant_type = 1 [
    json_name = "grant_type",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "授权类型，此处的值固定为\"password\"，必选项。",
      default: {string: "password"}
    }
  ]; // 授权类型，此处的值固定为"password"，必选项。

  optional string client_id = 2 [
    json_name = "client_id",
    (gnostic.openapi.v3.property) = {
      description: "客户端ID"
    }
  ];
  optional string client_secret = 3 [
    json_name = "client_secret",
    (gnostic.openapi.v3.property) = {
      description: "客户端密钥"
    }
  ];

  optional string scope = 4 [
    json_name = "scope",
    (gnostic.openapi.v3.property) = {
      description: "以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。"
    }
  ]; // 以空格分隔的范围列表。如果未提供，scope则授权任何范围，默认为空列表。

  optional string redirect_uri = 5 [
    json_name = "redirect_uri",
    (gnostic.openapi.v3.property) = {description: "跳转链接"}
  ]; // 跳转链接

  optional uint32 user_id = 6 [
    json_name = "user_id",
    (gnostic.openapi.v3.property) = {
      description: "用户ID"
    }
  ]; // 用户ID

  // 登录标识（用户名、邮箱、手机号三选一）
  oneof identifier {
    string username = 10 [
      json_name = "username",
      (gnostic.openapi.v3.property) = {description: "用户名"}
    ]; // 用户名
    string email = 11 [
      json_name = "email",
      (gnostic.openapi.v3.property) = {description: "电子邮件地址"}
    ]; // 电子邮件地址
    string mobile = 12 [
      json_name = "mobile",
      (gnostic.openapi.v3.property) = {description: "手机号"}
    ]; // 手机号
  }

  optional string password = 19 [
    json_name = "password",
    (gnostic.openapi.v3.property) = {description: "用户的密码"}
  ]; // 用户的密码，必选项。

  optional string refresh_token = 20 [
    json_name = "refresh_token",
    (gnostic.openapi.v3.property) = {
      description: "更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。"
    }
  ]; // 更新令牌，用来获取下一次的访问令牌，必选项。

  optional string code = 30 [
    json_name = "code",
    (gnostic.openapi.v3.property) = {
      description: "授权请求中收到的一次性验证/认证码。(当使用授权码模式时)"
    }
  ]; // 授权请求中收到的一次性验证/认证码。(当使用授权码模式时)

  optional ClientType client_type = 40 [
    json_name = "client_type",
    (gnostic.openapi.v3.property) = {
      description: "客户端类型"
    }
  ]; // 客户端类型

  optional string device_id = 50 [
    json_name = "device_id",
    (gnostic.openapi.v3.property) = {
      description: "设备唯一标识（可选），用于设备绑定、推送、风控等"
    }
  ];

  optional string jti = 60 [
    json_name = "jti",
    (gnostic.openapi.v3.property) = {
      description: "建议客户端生成并提供 jti（JWT ID）作为唯一标识，服务端可据此防止重放攻击"
    }
  ];

  optional string tenant_code = 70 [
    json_name = "tenant_code",
    (gnostic.openapi.v3.property) = {
      description: "租户编号，留空表示平台登录（平台超级管理员）；非空时按该编号解析对应租户"
    }
  ]; // 租户编号，留空表示平台登录，非空时解析对应租户
}

// 用户登录 - 回应。与 cms LoginResponse 同构。
message LoginResponse {
  TokenType token_type = 1 [
    json_name = "token_type",
    (gnostic.openapi.v3.property) = {
      description: "令牌的类型，该值大小写不敏感，必选项，可以是bearer类型或mac类型，通常只是字符串“Bearer”。",
      default: {string: "Bearer"}
    }
  ]; // 令牌类型，该值大小写不敏感，必选项，可以是bearer类型或mac类型。

  string access_token = 2 [
    json_name = "access_token",
    (gnostic.openapi.v3.property) = {
      description: "访问令牌，必选项。授权服务器颁发的访问令牌字符串。"
    }
  ]; // 访问令牌，必选项。

  int64 expires_in = 3 [
    json_name = "expires_in",
    (gnostic.openapi.v3.property) = {
      description: "访问令牌过期时间（秒）"
    }
  ]; // 访问令牌过期时间（秒）

  optional string refresh_token = 4 [
    json_name = "refresh_token",
    (gnostic.openapi.v3.property) = {
      description: "更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌获取另一个访问令牌。但是，通过隐性授予颁发的令牌不能颁发刷新令牌。"
    }
  ]; // 更新令牌，用来获取下一次的访问令牌，可选项。

  optional string scope = 5 [
    json_name = "scope",
    (gnostic.openapi.v3.property) = {
      description: "以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。"
    }
  ]; // 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。

  optional int64 refresh_expires_in = 6 [
    json_name = "refresh_expires_in",
    (gnostic.openapi.v3.property) = {
      description: "刷新令牌过期时间（秒）"
    }
  ]; // 刷新令牌过期时间（秒）

  optional string id_token = 7 [
    json_name = "id_token",
    (gnostic.openapi.v3.property) = {
      description: "ID 令牌，OpenID Connect 扩展中定义的 JWT 格式令牌"
    }
  ]; // ID 令牌，OpenID Connect 扩展中定义的 JWT 格式令牌
}

// 生成验证码 - 回应。与 cms GenerateCaptchaResponse 同构。
message GenerateCaptchaResponse {
  string captcha_id = 1 [
    json_name = "captchaId",
    (gnostic.openapi.v3.property) = {
      description: "验证码ID，客户端应在后续请求中提供该ID以验证用户输入的验证码"
    }
  ]; // 验证码ID，客户端应在后续请求中提供该ID以验证用户输入的验证码

  string image_base64 = 2 [
    json_name = "imageBase64",
    (gnostic.openapi.v3.property) = {
      description: "验证码图片的Base64编码字符串，客户端可以解码并显示给用户"
    }
  ]; // 验证图片的Base64编码字符串，客户端可以解码并显示给用户
}

// 验证验证码 - 请求。与 cms VerifyCaptchaRequest 同构。
message VerifyCaptchaRequest {
  string captcha_id = 1 [
    json_name = "captchaId",
    (gnostic.openapi.v3.property) = {
      description: "验证码ID，来自 GenerateCaptcha 响应"
    }
  ]; // 验证码ID，来自 GenerateCaptcha 响应

  string user_input = 2 [
    json_name = "userInput",
    (gnostic.openapi.v3.property) = {
      description: "用户输入的验证码文本"
    }
  ]; // 用户输入的验证码文本
}

// 验证验证码 - 回应。与 cms VerifyCaptchaResponse 同构。
message VerifyCaptchaResponse {
  bool valid = 1 [
    json_name = "valid",
    (gnostic.openapi.v3.property) = {
      description: "验证码验证结果，true表示验证成功，false表示验证失败"
    }
  ]; // 验证码验证结果，true表示验证成功，false表示验证失败
}
