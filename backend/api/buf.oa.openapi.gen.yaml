version: v2

# OA OpenAPI v3 文档生成模板。
#
# 与 go-wind-admin/backend/api/buf.admin.openapi.gen.yaml 同构，差异：
#  - inputs 指向 OA 自有的 protos/oa/v1；
#  - out 指向 OA 倉内 app/oa/service/cmd/server/assets/。
#
# 产物 openapi.yaml 供 frontend/mobile（拷自 cms flutter_app）的 swagger_parser
# 消费，生成 Dart API 客户端。
#
# 运行：cd backend/app/oa/service && make openapi
#   （Makefile 目标对齐 cms app.mk 第 135-137 行）

clean: false

managed:
  enabled: true

  disable:
    - module: buf.build/googleapis/googleapis
    - module: 'buf.build/envoyproxy/protoc-gen-validate'
    - module: 'buf.build/kratos/apis'
    - module: 'buf.build/gnostic/gnostic'
    - module: 'buf.build/gogo/protobuf'
    - module: 'buf.build/tx7do/pagination'
    - module: 'buf.build/go-wind/redact'

  override:
    - file_option: go_package_prefix
      value: go-wind-oa/api/gen/go

inputs:
  - directory: protos
    paths:
      - protos/oa/v1

plugins:
  # generate openapi v3 yaml doc
  - local: protoc-gen-openapi
    out: ../app/oa/service/cmd/server/assets
    opt:
      - naming=json # 命名约定。使用"proto"则直接从proto文件传递名称。默认为：json
      - depth=2 # 循环消息的递归深度，默认为：2
      - default_response=false # 添加默认响应消息。默认为：true。
      - enum_type=string # 枚举类型的序列化的类型。默认为：integer。
      - output_mode=merged # 输出文件生成模式。默认为：merged。
      - fq_schema_naming=false # Schema的命名是否加上包名。默认为：false。
