# OA 移動端（Flutter 基座）Dart API 客户端生成模板。
#
# inputs 覆蓋 app/service/v1（鑑權 + 工作流的 app HTTP 端點包裝）。
# 工作流的 HTTP 注解定義在 app/service/v1/i_workflow.proto，引用
# oa.service.v1 的消息類型——Dart 生成器會自動跟隨 import 解析消息定義，
# 但只在有 http annotation 的 app wrapper proto 上生成 service client。
# 不含 oa/service/v1（core 純 gRPC proto，無 http annotation）。
#
# 运行：cd backend/api && buf generate --template buf.flutter.oa.dart.gen.yaml

version: v2

clean: true

managed:
  enabled: true

  disable:
    - module: buf.build/googleapis/googleapis
    - module: 'buf.build/envoyproxy/protoc-gen-validate'
    - module: 'buf.build/kratos/apis'
    - module: buf.build/gnostic/gnostic
    - module: buf.build/gogo/protobuf
    - module: buf.build/tx7do/pagination
    - module: buf.build/go-wind/redact

inputs:
  - directory: protos
    paths:
      - protos/app/service/v1

plugins:
  - local: protoc-gen-dart-http
    out: ../../frontend/mobile/lib/generated/api
