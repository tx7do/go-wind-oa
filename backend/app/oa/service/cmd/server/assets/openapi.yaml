tags:
    - name: AuthenticationService
      description: |-
        OA 鉴权服务。

         该服务为单层服务：HTTP 注解与本消息定义同在一个 proto 中，由 buf 一次性
         生成 gRPC 与 HTTP 双协议桩。

         OA 后端不自建账号体系，登录/登出/验证码/令牌刷新均经此服务转发至
         go-wind-cms 的 admin-service AuthenticationService（cms
         authentication.proto / i_authentication.proto 的 admin 端 HTTP 包装）。
         消息定义（LoginRequest/LoginResponse/GrantType/TokenType/ClientType/
         GenerateCaptchaResponse/VerifyCaptchaRequest/VerifyCaptchaResponse）与
         cms authentication.service.v1 同构——字段编号、json_name、gnostic
         OpenAPI 描述均逐字段对齐，使 oa↔cms 的结构体翻译为零损耗。

         与 cms 的差异：
           - package 为 oa.v1（由 OA buf managed 映射至 go-wind-oa/api/gen/go/oa/v1）；
           - 剥离 (redact.value) 注解——该注解仅用于 cms 服务端日志脱敏，OA 转发层
             不落日志、不依赖 redact proto；
           - 不含 RegisterUser / WhoAmI / BlockToken 等 cms 管理端专有 RPC（OA
             仅需登录闭环）。
    - name: WorkflowService
      description: |-
        OA 工作流审批服务。

         该服务为单层服务：HTTP 注解与本消息定义同在一个 proto 中，由 buf 一次性
         生成 gRPC 与 HTTP 双协议桩。所有 RPC 均需鉴权，租户/操作人上下文由
         auth 中间件注入、由 OA viewer 中间件翻译为 ent viewer context，
         供 TenantPrivacy 策略做行级租户隔离。
