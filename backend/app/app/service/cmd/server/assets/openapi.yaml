            type: object
            properties:
                id:
                    type: integer
                    description: 申请单ID
                    format: uint32
                instanceId:
                    type: integer
                    description: 工作流实例ID
                    format: uint32
            description: 提交出差申请 - 回应
        oa.service.v1.SubmitExpenseApplicationRequest:
            type: object
            properties:
                title:
                    type: string
                    description: 报销事由标题
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/oa.service.v1.ExpenseItem'
                    description: 费用明细（id/tenant_id/created_at 由服务端忽略）
            description: 提交报销申请 - 请求
        oa.service.v1.SubmitExpenseApplicationResponse:
            type: object
            properties:
                id:
                    type: integer
                    description: 申请单ID
                    format: uint32
                instanceId:
                    type: integer
                    description: 工作流实例ID
                    format: uint32
            description: 提交报销申请 - 回应
        oa.service.v1.SubmitLeaveApplicationRequest:
            type: object
            properties:
                leaveTypeId:
                    type: integer
                    description: 请假类型ID
                    format: uint32
                startDate:
                    type: string
                    description: 开始日期
                    format: date-time
                endDate:
                    type: string
                    description: 结束日期（含）
                    format: date-time
                reason:
                    type: string
                    description: 请假事由
                startHalf:
                    enum:
                        - AM
                        - PM
                    type: string
                    description: 开始半日（不传默认 AM 上午起）
                    format: enum
                endHalf:
                    enum:
                        - AM
                        - PM
                    type: string
                    description: 结束半日（不传默认 PM 下午止）
                    format: enum
            description: 提交请假申请 - 请求
        oa.service.v1.SubmitLeaveApplicationResponse:
            type: object
            properties:
                id:
                    type: integer
                    description: 申请单ID
                    format: uint32
                instanceId:
                    type: integer
                    description: 工作流实例ID
                    format: uint32
            description: 提交请假申请 - 回应
        oa.service.v1.SubmitOutingApplicationRequest:
            type: object
            properties:
                reason:
                    type: string
                    description: 外出事由
                destination:
                    type: string
                    description: 外出目的地
                startTime:
                    type: string
                    description: 外出开始时间
                    format: date-time
                endTime:
                    type: string
                    description: 外出结束时间
                    format: date-time
            description: 提交外出申请 - 请求
        oa.service.v1.SubmitOutingApplicationResponse:
            type: object
            properties:
                id:
                    type: integer
                    description: 申请单ID
                    format: uint32
                instanceId:
                    type: integer
                    description: 工作流实例ID
                    format: uint32
            description: 提交外出申请 - 回应
        oa.service.v1.SubmitOvertimeApplicationRequest:
            type: object
            properties:
                reason:
                    type: string
                    description: 加班事由
                startTime:
                    type: string
                    description: 加班开始时间
                    format: date-time
                endTime:
                    type: string
                    description: 加班结束时间
                    format: date-time
                compensationType:
                    enum:
                        - COMP_LEAVE
                        - OVERTIME_PAY
                    type: string
                    description: 补偿方式（调休/加班费）
                    format: enum
            description: 提交加班申请 - 请求
        oa.service.v1.SubmitOvertimeApplicationResponse:
            type: object
            properties:
                id:
                    type: integer
                    description: 申请单ID
                    format: uint32
                instanceId:
                    type: integer
                    description: 工作流实例ID
                    format: uint32
            description: 提交加班申请 - 回应
        oa.service.v1.SubmitSealApplicationRequest:
            type: object
            properties:
                purpose:
                    type: string
                    description: 用印事由
                sealType:
                    enum:
                        - OFFICIAL_SEAL
                        - CONTRACT_SEAL
                        - FINANCE_SEAL
                        - LEGAL_SEAL
                    type: string
                    description: 印章类型
                    format: enum
                fileCount:
                    type: integer
                    description: 用印文件份数
                    format: int32
                recipient:
                    type: string
                    description: 收件方
            description: 提交用印申请 - 请求
        oa.service.v1.SubmitSealApplicationResponse:
            type: object
            properties:
                id:
                    type: integer
                    description: 申请单ID
                    format: uint32
                instanceId:
                    type: integer
                    description: 工作流实例ID
                    format: uint32
            description: 提交用印申请 - 回应
        oa.service.v1.WithdrawApplyRequest:
            type: object
            properties:
                instanceId:
                    type: integer
                    description: 实例ID
                    format: uint32
            description: 撤回申请 - 请求
        oa.service.v1.WorkflowLog:
            type: object
            properties:
                id:
                    type: integer
                    description: 日志ID
                    format: uint32
                nodeId:
                    type: string
                    description: 图节点ID
                logAction:
                    enum:
                        - SUBMIT
                        - APPROVE
                        - REJECT
                        - FORWARD
                        - WITHDRAW
                    type: string
                    description: 日志动作
                    format: enum
                comment:
                    type: string
                    description: 审批意见
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 审批日志
        oa.service.v1.WorkflowTask:
            type: object
            properties:
                id:
                    type: integer
                    description: 任务ID
                    format: uint32
                nodeId:
                    type: string
                    description: 图节点ID
                assigneeUserId:
                    type: integer
                    description: 指派审批人ID
                    format: uint32
                taskStatus:
                    enum:
                        - PENDING
                        - APPROVED
                        - REJECTED
                        - CANCELLED
                    type: string
                    description: 任务状态
                    format: enum
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 审批任务
        storage.service.v1.DownloadFileResponse:
            type: object
            properties:
                file:
                    type: string
                    description: 直接返回文件字节（小文件或同步场景）
                    format: bytes
                downloadUrl:
                    type: string
                    description: 预签名 URL（大文件或异步下载）
                sourceFileName:
                    type: string
                    description: 原始文件名，客户端用于保存或显示
                mime:
                    type: string
                    description: MIME 类型，默认 application/octet-stream
                size:
                    type: string
                    description: 文件大小（字节），可用于进度或校验
                checksum:
                    type: string
                    description: 可选，文件校验（如 MD5 或 SHA256）
                storagePath:
                    type: string
                    description: 可选，后端存储位置或 key
                updatedAt:
                    type: string
                    description: 可选，最后修改时间
                    format: date-time
            description: 文件下载响应
        storage.service.v1.PresignOption:
            type: object
            properties:
                method:
                    type: string
                    description: 预签名使用的 HTTP 方法，例如 PUT 或 POST
                expireSeconds:
                    type: integer
                    description: 预签名有效期（秒）
                    format: int32
                contentType:
                    type: string
                    description: 预签名约束的 Content-Type（可选）
            description: 预签名选项
        storage.service.v1.StorageObject:
            type: object
            properties:
                bucketName:
                    type: string
                    description: 目标文件桶名称
                fileDirectory:
                    example: tenant/1001/user/avatar/
                    type: string
                    description: 存储目录（如 'user/1001/avatar/'），服务端会在此目录下生成唯一文件名
                objectName:
                    example: user/1001/avatar.jpg
                    type: string
                    description: OSS 对象键（完整路径，如 'user/1001/avatar.jpg'）。若未提供，服务端将自动生成。
            description: 对象存储对象
        storage.service.v1.UploadFileRequest:
            type: object
            properties:
                storageObject:
                    $ref: '#/components/schemas/storage.service.v1.StorageObject'
                file:
                    type: string
                    description: 直接上传的文件内容（内联字节）
                    format: bytes
                presign:
                    $ref: '#/components/schemas/storage.service.v1.PresignOption'
                sourceFileName:
                    type: string
                    description: 原文件文件名
                mime:
                    type: string
                    description: 文件的MIME类型
                size:
                    type: string
                    description: 文件大小（字节）
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
        storage.service.v1.UploadFileResponse:
            type: object
            properties:
                objectName:
                    type: string
                    description: OSS 对象键
                presignedUrl:
                    type: string
                    description: 预签名上传链接
                fileId:
                    type: integer
                    description: 落库的文件记录ID（业务单据引用此ID，如报销发票）
                    format: uint32
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: AttendanceService
      description: OA 考勤参与服务（app 边端，移动端）
    - name: AuthenticationService
      description: 用户前台登录认证服务
    - name: BusinessTripService
      description: OA 出差申请参与服务（app 边端，移动端）
    - name: ExpenseService
      description: OA 报销参与服务（app 边端，移动端）
    - name: FileTransferService
      description: 文件传输服务
    - name: InternalMessageService
      description: 站内信参与服务（app 边端，移动端，只读收件箱）
    - name: LeaveService
      description: OA 请假参与服务（app 边端，移动端）
    - name: OrgUnitService
      description: 组织单元查询服务（app 边端，移动端通讯录用，只读）
    - name: OutingService
      description: OA 外出申请参与服务（app 边端，移动端）
    - name: OvertimeService
      description: OA 加班申请参与服务（app 边端，移动端）
    - name: SealApplicationService
      description: OA 用印申请参与服务（app 边端，移动端）
    - name: UserProfileService
      description: 用户个人资料服务
    - name: UserService
      description: 通讯录用户查询服务（app 边端，移动端通讯录用，只读，带脱敏）
    - name: WorkflowService
      description: OA 工作流参与服务（app 边端，移动端）
