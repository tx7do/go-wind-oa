components:
    schemas:
        KratosStatus:
            type: object
            properties:
                code:
                    type: number
                    description: 错误码
                    format: int32
                message:
                    type: string
                    description: 错误消息
                reason:
                    type: string
                    description: 错误原因
                metadata:
                    type: object
                    description: 元数据
            description: Kratos错误返回
        authentication.service.v1.LoginRequest:
            required:
                - grant_type
            type: object
            properties:
                grant_type:
                    enum:
                        - password
                        - client_credentials
                        - authorization_code
                        - refresh_token
                        - implicit
                    type: string
                    default: password
                    description: 授权类型，此处的值固定为"password"，必选项。
                    format: enum
                client_id:
                    type: string
                    description: 客户端ID
                client_secret:
                    type: string
                    description: 客户端密钥
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                redirect_uri:
                    type: string
                    description: 跳转链接
                user_id:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 用户名
                email:
                    type: string
                    description: 电子邮件地址
                mobile:
                    type: string
                    description: 手机号
                password:
                    type: string
                    description: 用户的密码
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                code:
                    type: string
                    description: 授权请求中收到的一次性验证/认证码。(当使用授权码模式时)
                client_type:
                    enum:
                        - admin
                        - app
                    type: string
                    description: 客户端类型
                    format: enum
                device_id:
                    type: string
                    description: 设备唯一标识（可选），用于设备绑定、推送、风控等
                jti:
                    type: string
                    description: 建议客户端生成并提供 jti（JWT ID）作为唯一标识，服务端可据此防止重放攻击
                tenant_code:
                    type: string
                    description: 租户编号，留空表示平台登录（平台超级管理员）；非空时按该编号解析对应租户
            description: 用户登录 - 请求
        authentication.service.v1.LoginResponse:
            type: object
            properties:
                token_type:
                    enum:
                        - bearer
                        - mac
                    type: string
                    default: Bearer
                    description: 令牌的类型，该值大小写不敏感，必选项，可以是bearer类型或mac类型，通常只是字符串“Bearer”。
                    format: enum
                access_token:
                    type: string
                    description: 访问令牌，必选项。授权服务器颁发的访问令牌字符串。
                expires_in:
                    type: string
                    description: 访问令牌过期时间（秒）
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                refresh_expires_in:
                    type: string
                    description: 刷新令牌过期时间（秒）
                id_token:
                    type: string
                    description: ID 令牌，OpenID Connect 扩展中定义的 JWT 格式令牌
            description: 用户登录 - 回应
        comment.service.v1.Comment:
            type: object
            properties:
                id:
                    type: integer
                    description: 评论ID
                    format: uint32
                contentType:
                    enum:
                        - CONTENT_TYPE_UNSPECIFIED
                        - CONTENT_TYPE_POST
                        - CONTENT_TYPE_PAGE
                        - CONTENT_TYPE_PRODUCT
                    type: string
                    description: 内容类型
                    format: enum
                objectId:
                    type: integer
                    description: 对象ID
                    format: uint32
                content:
                    type: string
                    description: 评论内容
                authorId:
                    type: integer
                    description: 评论作者ID，0表示游客
                    format: uint32
                authorName:
                    type: string
                    description: 评论作者名称（游客填写）
                authorEmail:
                    type: string
                    description: 评论作者邮箱（游客填写）
                authorUrl:
                    type: string
                    description: 评论作者网址（游客填写）
                authorType:
                    enum:
                        - AUTHOR_TYPE_UNSPECIFIED
                        - AUTHOR_TYPE_GUEST
                        - AUTHOR_TYPE_USER
                        - AUTHOR_TYPE_ADMIN
                        - AUTHOR_TYPE_MODERATOR
                    type: string
                    description: 作者类型（用于前端高亮管理员回复）
                    format: enum
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_PENDING
                        - STATUS_APPROVED
                        - STATUS_REJECTED
                        - STATUS_SPAM
                    type: string
                    description: 评论状态
                    format: enum
                ipAddress:
                    type: string
                    description: 评论者 IP（脱敏存储，如 192.168.1.*）
                location:
                    type: string
                    description: 评论者地理位置（根据 IP 反查，可能不准确）
                userAgent:
                    type: string
                    description: User-Agent
                detectedLanguage:
                    type: string
                    description: 自动检测的语言代码（ISO 639-1，如 'zh', 'en'）
                isSpam:
                    type: boolean
                    description: 是否标记为垃圾评论
                isSticky:
                    type: boolean
                    description: 是否置顶评论
                parentId:
                    type: integer
                    description: 父节点ID
                    format: uint32
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/comment.service.v1.Comment'
                    description: 子节点树
                replyToId:
                    type: integer
                    description: 回复的评论ID（记录 '@某人' 关系，可能与 parent_id 不同）
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 评论
        comment.service.v1.CreateCommentRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/comment.service.v1.Comment'
            description: 请求 - 创建评论
        comment.service.v1.ListCommentResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/comment.service.v1.Comment'
                total:
                    type: string
            description: 回应 - 评论列表
        comment.service.v1.UpdateCommentRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/comment.service.v1.Comment'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 请求 - 更新评论
        content.service.v1.Category:
            type: object
            properties:
                id:
                    type: integer
                    description: 类别ID
                    format: uint32
                status:
                    enum:
                        - CATEGORY_STATUS_UNSPECIFIED
                        - CATEGORY_STATUS_ACTIVE
                        - CATEGORY_STATUS_HIDDEN
                        - CATEGORY_STATUS_ARCHIVED
                    type: string
                    description: 分类状态
                    format: enum
                sortOrder:
                    type: integer
                    description: 排序优先级（数值越小越靠前，同级分类间排序）
                    format: uint32
                isNav:
                    type: boolean
                    description: 是否显示在导航菜单
                icon:
                    type: string
                    description: 分类图标
                code:
                    type: string
                    description: 唯一代码（如 slug、编码等，便于唯一标识分类）
                postCount:
                    type: integer
                    description: 该分类下的文章总数（含子分类，可选）
                    format: uint32
                directPostCount:
                    type: integer
                    description: 该分类下的直接文章数（不含子分类）
                    format: uint32
                translations:
                    type: array
                    items:
                        $ref: '#/components/schemas/content.service.v1.CategoryTranslation'
                    description: 多语言翻译列表
                availableLanguages:
                    example: ["zh-CN", "en-US", "ja-JP"]
                    type: array
                    items:
                        type: string
                    description: 可用的语言代码列表（快速查询，避免遍历 translations）
                customFields:
                    type: object
                    additionalProperties:
                        type: string
                    description: 自定义字段，键值对形式，便于扩展
                parentId:
                    type: integer
                    description: 父节点ID
                    format: uint32
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/content.service.v1.Category'
                    description: 子节点树
                depth:
                    type: integer
                    description: 分类层级深度（0=顶级，1=二级，以此类推）
                    format: int32
                path:
                    type: string
                    description: 物化路径（Materialized Path），如 '1/5/23'，便于层级查询
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 类别
        content.service.v1.CategoryTranslation:
            type: object
            properties:
                id:
                    type: integer
                    description: 翻译记录ID
                    format: uint32
                categoryId:
                    type: integer
                    description: 关联的分类ID
                    format: uint32
                languageCode:
                    type: string
                    description: 语言代码
                name:
                    type: string
                    description: 分类名称
                slug:
                    type: string
                    description: 分类别名
                description:
                    type: string
                    description: 分类描述
                thumbnail:
                    type: string
                    description: 缩略图
                coverImage:
                    type: string
                    description: 封面图
                fullPath:
                    type: string
                    description: 完整路径（如 /zh-CN/category/tech）
                seo:
                    $ref: '#/components/schemas/content.service.v1.SeoMeta'
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
