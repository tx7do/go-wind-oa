        site.service.v1.CreateNavigationRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/site.service.v1.Navigation'
            description: 请求 - 创建导航
        site.service.v1.ListNavigationResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/site.service.v1.Navigation'
                total:
                    type: string
            description: 回应 - 导航列表
        site.service.v1.Navigation:
            type: object
            properties:
                id:
                    type: integer
                    description: 导航ID
                    format: uint32
                name:
                    type: string
                    description: 导航名称（如'主导航'、'页脚'）
                location:
                    enum:
                        - NAVIGATION_LOCATION_UNSPECIFIED
                        - HEADER
                        - FOOTER
                        - SIDEBAR
                        - MOBILE
                        - TOP_BAR
                        - OFFCANVAS
                    type: string
                    description: 渲染位置
                    format: enum
                locale:
                    type: string
                    description: 关联的语言区域（如 'zh-CN', 'en-US'），空值表示默认/通用导航；仅用于后台管理筛选，不影响前端渲染逻辑
                isActive:
                    type: boolean
                    description: 是否启用（禁用后前端不渲染）
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/site.service.v1.NavigationItem'
                    description: 导航项列表（按 sort_order 排序）
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 导航
        site.service.v1.NavigationItem:
            type: object
            properties:
                id:
                    type: integer
                    description: 导航项目项ID
                    format: uint32
                navigationId:
                    type: integer
                    description: 所属导航项目菜单ID
                    format: uint32
                title:
                    type: string
                    description: 显示文本（单语言，多语言通过多套导航项目实现）
                description:
                    type: string
                    description: 描述文本（用于悬停提示或移动端）
                icon:
                    type: string
                    description: 图标（支持 Font Awesome 格式如 'fas fa-home'，或 SVG URL）
                url:
                    type: string
                    description: 目标 URL（link_type=CUSTOM/EXTERNAL 时必填；关联类型可自动生成）
                linkType:
                    enum:
                        - LINK_TYPE_UNSPECIFIED
                        - LINK_TYPE_CUSTOM
                        - LINK_TYPE_POST
                        - LINK_TYPE_PAGE
                        - LINK_TYPE_CATEGORY
                        - LINK_TYPE_EXTERNAL
                    type: string
                    description: 链接类型
                    format: enum
                objectId:
                    type: integer
                    description: 关联对象ID（link_type=POST/PAGE/CATEGORY 时使用）
                    format: uint32
                sortOrder:
                    type: integer
                    description: 排序优先级（数值越小越靠前）
                    format: uint32
                isOpenNewTab:
                    type: boolean
                    description: 是否在新标签页打开
                isInvalid:
                    type: boolean
                    description: 是否无效（如关联的文章/页面被删除或设置为不可见，前端可根据此字段决定是否隐藏该导航项目项）
                requiredPermission:
                    type: string
                    description: 访问权限标识（如 view_admin_panel，前端可根据用户权限决定是否显示该导航项目项）
                parentId:
                    type: integer
                    description: 父菜单项ID（0 表示顶级项）
                    format: uint32
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/site.service.v1.NavigationItem'
                    description: 子节点树
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 导航项目项
        site.service.v1.UpdateNavigationRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/site.service.v1.Navigation'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 请求 - 更新导航
        storage.service.v1.DownloadFileResponse:
            type: object
            properties:
                file:
                    type: string
                    description: 直接返回文件字节（小文件或同步场景）
                    format: bytes
                downloadUrl:
                    type: string
                    description: 预签名 URL（大文件或异步下载）
                sourceFileName:
                    type: string
                    description: 原始文件名，客户端用于保存或显示
                mime:
                    type: string
                    description: MIME 类型，默认 application/octet-stream
                size:
                    type: string
                    description: 文件大小（字节），可用于进度或校验
                checksum:
                    type: string
                    description: 可选，文件校验（如 MD5 或 SHA256）
                storagePath:
                    type: string
                    description: 可选，后端存储位置或 key
                updatedAt:
                    type: string
                    description: 可选，最后修改时间
                    format: date-time
            description: 文件下载响应
        storage.service.v1.PresignOption:
            type: object
            properties:
                method:
                    type: string
                    description: 预签名使用的 HTTP 方法，例如 PUT 或 POST
                expireSeconds:
                    type: integer
                    description: 预签名有效期（秒）
                    format: int32
                contentType:
                    type: string
                    description: 预签名约束的 Content-Type（可选）
            description: 预签名选项
        storage.service.v1.StorageObject:
            type: object
            properties:
                bucketName:
                    type: string
                    description: 目标文件桶名称
                fileDirectory:
                    example: tenant/1001/user/avatar/
                    type: string
                    description: 存储目录（如 'user/1001/avatar/'），服务端会在此目录下生成唯一文件名
                objectName:
                    example: user/1001/avatar.jpg
                    type: string
                    description: OSS 对象键（完整路径，如 'user/1001/avatar.jpg'）。若未提供，服务端将自动生成。
            description: 对象存储对象
        storage.service.v1.UploadFileRequest:
            type: object
            properties:
                storageObject:
                    $ref: '#/components/schemas/storage.service.v1.StorageObject'
                file:
                    type: string
                    description: 直接上传的文件内容（内联字节）
                    format: bytes
                presign:
                    $ref: '#/components/schemas/storage.service.v1.PresignOption'
                sourceFileName:
                    type: string
                    description: 原文件文件名
                mime:
                    type: string
                    description: 文件的MIME类型
                size:
                    type: string
                    description: 文件大小（字节）
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
        storage.service.v1.UploadFileResponse:
            type: object
            properties:
                objectName:
                    type: string
                    description: OSS 对象键
                presignedUrl:
                    type: string
                    description: 预签名上传链接
                fileId:
                    type: integer
                    description: 落库的文件记录ID（业务单据引用此ID，如报销发票）
                    format: uint32
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: AttendanceService
      description: OA 考勤参与服务（app 边端，移动端）
    - name: AuthenticationService
      description: 用户前台登录认证服务
    - name: CategoryService
      description: 类别服务
    - name: CommentService
      description: 评论服务
    - name: ExpenseService
      description: OA 报销参与服务（app 边端，移动端）
    - name: FileTransferService
      description: 文件传输服务
    - name: InteractionService
      description: 交互服务（点赞/收藏）
    - name: InternalMessageService
      description: 站内信参与服务（app 边端，移动端，只读收件箱）
    - name: LeaveService
      description: OA 请假参与服务（app 边端，移动端）
    - name: NavigationService
      description: 导航服务
    - name: PageService
      description: 页面服务
    - name: PostService
      description: 帖子服务
    - name: SectionService
      description: 页面区块服务
    - name: TagService
      description: 标签服务
    - name: UserProfileService
      description: 用户个人资料服务
    - name: WorkflowService
      description: OA 工作流参与服务（app 边端，移动端）
