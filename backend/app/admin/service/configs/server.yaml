server:
  rest:
    addr: "0.0.0.0:6680"
    timeout: 10s
    enable_swagger: false
    cors:
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
        - "X-Captcha-Id"
        - "X-Captcha-Value"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "http://localhost:15787"
        - "http://127.0.0.1:15787"
    middleware:
      auth:
        method: "HS256"
        key: "${jwt_signing_key:dev_only_change_me_in_prod}"

  sse:
    addr: ":6681"
    codec: "json"
    path: "/events"
    auto_stream: true
    auto_reply: false

  grpc:
    addr: "0.0.0.0:0"
    timeout: 10s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true
